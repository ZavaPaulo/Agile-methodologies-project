<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compra simulada — Marketplace acadêmico</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
<header id="topo"></header>
<div class="etapas" id="etapas">
  <span class="etapa feita">✓ Catálogo</span><span class="etapa feita">✓ Carrinho</span>
  <span class="etapa atual">3 Compra simulada</span><span class="etapa">4 Confirmação</span>
</div>
<main class="pagina" id="telaPagamento"><p class="carregando">Carregando resumo da compra...</p></main>
<section class="pagina" id="confirmacao" hidden></section>
<script src="app.js"></script>
<script>
  montarCabecalho();
  const parametros = new URLSearchParams(location.search);
  const idDireto = Number(parametros.get("produto"));
  const qtdDireta = Number(parametros.get("qtd"));
  let itensCompra = [];
  let compraDireta = false;

  async function carregarResumo() {
    try {
      if (parametros.has("produto")) {
        if (!Number.isInteger(idDireto) || idDireto <= 0 ||
            !Number.isInteger(qtdDireta) || qtdDireta <= 0) {
          throw new Error("Produto ou quantidade inválidos.");
        }
        const produto = await buscarPorId(idDireto);
        if (qtdDireta > produto.quantidadeDisponivel) {
          throw new Error("Estoque insuficiente para a quantidade solicitada.");
        }
        itensCompra = [{produto:produto,quantidade:qtdDireta,subtotal:produto.valor*qtdDireta}];
        compraDireta = true;
      } else {
        const carrinho = await carregarCarrinho();
        itensCompra = carrinho.itens || [];
      }
      if (!itensCompra.length) throw new Error("Não há produtos para finalizar a compra.");

      const subtotal = itensCompra.reduce(function (soma,item) { return soma + item.subtotal; },0);
      document.getElementById("telaPagamento").innerHTML =
        '<div class="carrinho"><section class="caixa"><span class="selo-replica">SOMENTE RÉPLICA ACADÊMICA</span>' +
        '<h1>Dados para a compra simulada</h1>' +
        '<div class="aviso">Demonstração acadêmica: nenhum pagamento será processado. Não informe dados reais de cartão.</div>' +
        '<form id="formCompra"><h2>Dados de entrega</h2><div class="form-grid">' +
        '<label>Nome do destinatário<input name="nomeDestinatario" required maxlength="100"></label>' +
        '<label>Telefone com DDD<input name="telefone" inputmode="tel" placeholder="43999998888" required></label>' +
        '<label>CEP<input name="cep" placeholder="86010-000" required></label>' +
        '<label>Rua / Avenida<input name="logradouro" required></label>' +
        '<label>Número<input name="numero" required></label>' +
        '<label>Complemento (opcional)<input name="complemento"></label>' +
        '<label>Bairro<input name="bairro" required></label><label>Cidade<input name="cidade" required></label>' +
        '<label>Estado (UF)<input name="estado" maxlength="2" required></label></div>' +
        '<h2 class="espaco-topo">Modalidade de pagamento (simulada)</h2>' +
        '<label class="opcao"><input type="radio" name="formaPagamento" value="pix" checked><span><strong>Pix (simulação)</strong><small>Desconto demonstrativo de 5%</small></span></label>' +
        '<label class="opcao"><input type="radio" name="formaPagamento" value="boleto"><span><strong>Boleto (simulação)</strong><small>Nenhum boleto será emitido</small></span></label>' +
        '<label class="opcao"><input type="radio" name="formaPagamento" value="cartao"><span><strong>Cartão (simulação)</strong><small>Não informe dados de cartão</small></span></label>' +
        '<p class="mensagem-erro" id="erroCompra" role="alert" hidden></p>' +
        '<button class="btn" type="submit">Confirmar compra simulada</button></form></section>' +
        '<aside class="caixa resumo"><h2>Resumo da compra</h2>' +
        itensCompra.map(function(item) {
          return '<div class="item"><span>' + escaparHtml(item.produto.nomeProduto) + ' × ' + item.quantidade +
            '</span><strong>' + formatarPreco(item.subtotal) + '</strong></div>';
        }).join("") +
        '<div class="item"><span>Subtotal</span><strong>' + formatarPreco(subtotal) + '</strong></div>' +
        '<div class="item"><span>Entrega simulada</span><span class="verde">Grátis</span></div>' +
        '<div class="item"><span>Desconto Pix</span><span class="verde" id="descontoResumo">- ' + formatarPreco(subtotal*0.05) + '</span></div>' +
        '<div class="item total"><span>Total estimado</span><strong id="totalResumo">' + formatarPreco(subtotal*0.95) + '</strong></div></aside></div>';

      const form = document.getElementById("formCompra");
      const erro = document.getElementById("erroCompra");
      form.querySelectorAll('input[name="formaPagamento"]').forEach(function(input) {
        input.addEventListener("change",function() {
          const pix = form.elements.formaPagamento.value === "pix";
          document.getElementById("descontoResumo").textContent = pix ? "- " + formatarPreco(subtotal*0.05) : formatarPreco(0);
          document.getElementById("totalResumo").textContent = formatarPreco(pix ? subtotal*0.95 : subtotal);
        });
      });

      form.addEventListener("submit",async function(evento) {
        evento.preventDefault();
        erro.hidden = true;
        const campos = Object.fromEntries(new FormData(form).entries());
        const dados = {
          entrega:{
            nomeDestinatario:campos.nomeDestinatario,
            telefone:campos.telefone,cep:campos.cep,logradouro:campos.logradouro,
            numero:campos.numero,complemento:campos.complemento || "",
            bairro:campos.bairro,cidade:campos.cidade,estado:campos.estado
          },
          formaPagamento:campos.formaPagamento,
          itens:itensCompra.map(function(item) {
            return {idProduto:item.produto.idProduto,quantidade:item.quantidade};
          })
        };
        const botao = form.querySelector('button[type="submit"]');
        botao.disabled = true;
        botao.textContent = "Registrando compra...";
        try {
          const resultado = await finalizarCompra(dados);
          mostrarConfirmacao(resultado);
        } catch (erroApi) {
          erro.textContent = erroApi.message;
          erro.hidden = false;
          botao.disabled = false;
          botao.textContent = "Confirmar compra simulada";
        }
      });
    } catch (erroApi) {
      document.getElementById("telaPagamento").innerHTML =
        '<div class="caixa vazio"><h1>Não foi possível iniciar a compra</h1><p>' +
        escaparHtml(erroApi.message) + '</p><a class="btn auto" href="index.html">Voltar ao catálogo</a></div>';
    }
  }

  function mostrarConfirmacao(resultado) {
    document.getElementById("telaPagamento").hidden = true;
    document.getElementById("etapas").innerHTML =
      '<span class="etapa feita">✓ Catálogo</span><span class="etapa feita">✓ Carrinho</span>' +
      '<span class="etapa feita">✓ Pagamento simulado</span><span class="etapa atual">4 Confirmação</span>';
    const pedidos = resultado.pedidos || [];
    const confirmacao = document.getElementById("confirmacao");
    confirmacao.hidden = false;
    confirmacao.innerHTML =
      '<div class="caixa confirmacao-ok"><span class="selo-replica">RÉPLICA ACADÊMICA INDEPENDENTE</span>' +
      '<h1>Compra simulada registrada!</h1><p>' + escaparHtml(resultado.mensagem) + '</p>' +
      pedidos.map(function(p) {
        return '<div class="item"><span>' + escaparHtml(p.numero) + ' · ' + escaparHtml(p.nomeProduto) +
          ' × ' + p.quantidade + '</span><strong>' + formatarPreco(p.total) + '</strong></div>';
      }).join("") +
      '<div class="item total"><span>Subtotal</span><strong>' + formatarPreco(resultado.subtotal) + '</strong></div>' +
      '<div class="item"><span>Desconto</span><strong>' + formatarPreco(resultado.desconto) + '</strong></div>' +
      '<div class="item total"><span>Total simulado</span><strong>' + formatarPreco(resultado.total) + '</strong></div>' +
      '<p class="aviso">Pagamento não processado. Esta confirmação existe apenas para fins acadêmicos.</p>' +
      '<a class="btn auto" href="index.html">Voltar ao catálogo</a></div>';
    atualizarBadge();
    window.scrollTo({top:0,behavior:"smooth"});
  }
  carregarResumo();
</script>
</body>
</html>
